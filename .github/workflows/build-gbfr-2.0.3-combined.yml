name: Build GBFR 2.0.3 Combined

on:
  workflow_dispatch:
  push:
    branches:
      - codex/gbfr-2.0.3-combined

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v1.1.2

      - name: Build ReShade x64
        shell: pwsh
        run: >-
          msbuild "Source\External\reshade\ReShade.sln"
          /m
          /p:Configuration=Release
          /p:Platform=64-bit
          /p:PlatformToolset=v145

      - name: Build Granblue Fantasy Relink addon
        shell: pwsh
        run: >-
          msbuild "Source\Games\Granblue Fantasy Relink\Granblue Fantasy Relink.vcxproj"
          /m
          /p:Configuration=Publishing-Release
          /p:Platform=x64
          /p:PlatformToolset=v145
          /p:DefineConstants="REMOTE_BUILD=1"

      - name: Package combined build
        shell: pwsh
        run: |
          $packageRoot = "package"
          $lumaRoot = Join-Path $packageRoot "Luma"

          Remove-Item -Recurse -Force $packageRoot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $lumaRoot -Force | Out-Null

          foreach ($shaderDir in @("Global", "Includes", "Granblue Fantasy Relink")) {
            Copy-Item -Path (Join-Path "Shaders" $shaderDir) -Destination $lumaRoot -Recurse -Force
          }

          Get-ChildItem -Path $lumaRoot -Directory -Recurse |
            Where-Object { $_.Name -in @("Unused", "Dev", "Sample") } |
            Remove-Item -Recurse -Force

          Get-ChildItem -Path $lumaRoot -Recurse -File |
            Where-Object { $_.Extension.ToLowerInvariant() -notin @(".hlsl", ".hlsli") } |
            Remove-Item -Force

          Copy-Item "Shaders\Decompiler\d3dcompiler_47.dll" $lumaRoot -Force
          Copy-Item "Source\External\reshade\bin\x64\Release\ReShade64.dll" (Join-Path $packageRoot "dxgi.dll") -Force
          Copy-Item "Source\External\NGX\bin\rel\nvngx_dlss.dll" $packageRoot -Force

          $searchRoots = @("Binaries", "Source\Games\Granblue Fantasy Relink\Binaries") |
            Where-Object { Test-Path $_ }
          $addonFiles = @(
            Get-ChildItem -Path $searchRoots -Filter "*.addon" -Recurse |
              Where-Object { $_.FullName -match "x64-Publishing-Release" }
          )
          if ($addonFiles.Count -ne 1) {
            throw "Expected exactly one GBFR publishing addon, found $($addonFiles.Count)"
          }
          Copy-Item $addonFiles[0].FullName (Join-Path $packageRoot "Luma-Granblue Fantasy Relink.addon") -Force

          $requiredFiles = @(
            "dxgi.dll",
            "nvngx_dlss.dll",
            "Luma-Granblue Fantasy Relink.addon",
            "Luma\d3dcompiler_47.dll"
          )
          foreach ($requiredFile in $requiredFiles) {
            if (-not (Test-Path (Join-Path $packageRoot $requiredFile))) {
              throw "Missing package file: $requiredFile"
            }
          }

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Luma-Granblue_Fantasy_Relink-2.0.3-Combined
          path: package/
          if-no-files-found: error
          retention-days: 30
